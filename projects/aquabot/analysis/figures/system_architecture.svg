<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">AquaBot functional architecture</title>
  <desc id="desc">Surface water passes through a main pump and filter into a reservoir, then through a metering pump and needle dispenser into an indexed vial. The controller operates the pumps, drain valve, linear actuator and vial plate while reading a homing limit switch.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176B87"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #132238; }
      .section { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #132238; }
      .box-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #132238; }
      .box-copy { font-family: Arial, sans-serif; font-size: 16px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .fluid { fill: none; stroke: #176B87; stroke-width: 5; marker-end: url(#arrow-blue); }
      .control { fill: none; stroke: #B45309; stroke-width: 4; stroke-dasharray: 11 8; marker-end: url(#arrow-orange); }
      .feedback { fill: none; stroke: #B45309; stroke-width: 4; stroke-dasharray: 5 7; marker-end: url(#arrow-orange); }
      .fluid-box { fill: #E8F4F8; stroke: #176B87; stroke-width: 2.5; }
      .motion-box { fill: #F5F0FF; stroke: #7251B5; stroke-width: 2.5; }
      .control-box { fill: #FFF4E6; stroke: #B45309; stroke-width: 2.5; }
      .waste-box { fill: #F1F5F9; stroke: #64748B; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#FFFFFF"/>
  <text x="70" y="65" class="title">AquaBot functional architecture</text>
  <text x="70" y="100" class="small">Documented prototype configuration; arrows show fluid movement and controller signals</text>

  <text x="70" y="156" class="section">Sample path</text>

  <rect x="70" y="190" width="180" height="125" rx="16" class="fluid-box"/>
  <text x="160" y="235" text-anchor="middle" class="box-title">Surface water</text>
  <text x="160" y="268" text-anchor="middle" class="box-copy">Intake line placed</text>
  <text x="160" y="292" text-anchor="middle" class="box-copy">in river or lake</text>

  <rect x="300" y="190" width="190" height="125" rx="16" class="fluid-box"/>
  <text x="395" y="235" text-anchor="middle" class="box-title">Main pump</text>
  <text x="395" y="268" text-anchor="middle" class="box-copy">Peristaltic intake</text>
  <text x="395" y="292" text-anchor="middle" class="box-copy">and rinse flow</text>

  <rect x="540" y="190" width="185" height="125" rx="16" class="fluid-box"/>
  <text x="632.5" y="235" text-anchor="middle" class="box-title">0.45 µm filter</text>
  <text x="632.5" y="268" text-anchor="middle" class="box-copy">Defines the filtered</text>
  <text x="632.5" y="292" text-anchor="middle" class="box-copy">sample fraction</text>

  <rect x="775" y="190" width="180" height="125" rx="16" class="fluid-box"/>
  <text x="865" y="235" text-anchor="middle" class="box-title">Reservoir</text>
  <text x="865" y="268" text-anchor="middle" class="box-copy">Temporary holding</text>
  <text x="865" y="292" text-anchor="middle" class="box-copy">and purge point</text>

  <rect x="1005" y="190" width="180" height="125" rx="16" class="fluid-box"/>
  <text x="1095" y="235" text-anchor="middle" class="box-title">Metering pump</text>
  <text x="1095" y="268" text-anchor="middle" class="box-copy">Miniature</text>
  <text x="1095" y="292" text-anchor="middle" class="box-copy">peristaltic pump</text>

  <rect x="1235" y="190" width="150" height="125" rx="16" class="fluid-box"/>
  <text x="1310" y="235" text-anchor="middle" class="box-title">Dispenser</text>
  <text x="1310" y="268" text-anchor="middle" class="box-copy">Needle enters</text>
  <text x="1310" y="292" text-anchor="middle" class="box-copy">vial closure</text>

  <path d="M250 252.5 H300" class="fluid"/>
  <path d="M490 252.5 H540" class="fluid"/>
  <path d="M725 252.5 H775" class="fluid"/>
  <path d="M955 252.5 H1005" class="fluid"/>
  <path d="M1185 252.5 H1235" class="fluid"/>

  <rect x="1200" y="375" width="185" height="120" rx="16" class="motion-box"/>
  <text x="1292.5" y="416" text-anchor="middle" class="box-title">Selected vial</text>
  <text x="1292.5" y="449" text-anchor="middle" class="box-copy">Self-sealing closure</text>
  <text x="1292.5" y="475" text-anchor="middle" class="box-copy">on indexed plate</text>
  <path d="M1310 315 V375" class="fluid"/>

  <rect x="775" y="375" width="180" height="120" rx="16" class="waste-box"/>
  <text x="865" y="416" text-anchor="middle" class="box-title">Waste outlet</text>
  <text x="865" y="449" text-anchor="middle" class="box-copy">Reservoir drain and</text>
  <text x="865" y="475" text-anchor="middle" class="box-copy">rinse-water path</text>
  <path d="M865 315 V375" class="fluid"/>

  <text x="70" y="570" class="section">Automation</text>
  <rect x="70" y="605" width="255" height="105" rx="16" class="control-box"/>
  <text x="197.5" y="648" text-anchor="middle" class="box-title">Arduino controller</text>
  <text x="197.5" y="680" text-anchor="middle" class="box-copy">Executes the sampling sequence</text>

  <rect x="425" y="605" width="210" height="105" rx="16" class="motion-box"/>
  <text x="530" y="648" text-anchor="middle" class="box-title">Linear actuator</text>
  <text x="530" y="680" text-anchor="middle" class="box-copy">Raises and lowers needle</text>

  <rect x="735" y="605" width="210" height="105" rx="16" class="motion-box"/>
  <text x="840" y="648" text-anchor="middle" class="box-title">Stepper drive</text>
  <text x="840" y="680" text-anchor="middle" class="box-copy">Indexes the 32-position plate</text>

  <rect x="1045" y="605" width="210" height="105" rx="16" class="motion-box"/>
  <text x="1150" y="648" text-anchor="middle" class="box-title">Limit switch</text>
  <text x="1150" y="680" text-anchor="middle" class="box-copy">Establishes a home position</text>

  <path d="M325 635 H425" class="control"/>
  <path d="M325 660 H735" class="control"/>
  <path d="M1045 680 H945" class="feedback"/>

  <path d="M197.5 605 C197.5 520 395 520 395 315" class="control"/>
  <path d="M220 605 C220 545 1095 545 1095 315" class="control"/>
  <path d="M245 605 C245 565 865 565 865 495" class="control"/>

  <line x1="1070" y1="150" x2="1125" y2="150" class="fluid"/>
  <text x="1140" y="156" class="small">Fluid path</text>
  <line x1="1250" y1="150" x2="1305" y2="150" class="control"/>
  <text x="1320" y="156" class="small">Control</text>
</svg>
